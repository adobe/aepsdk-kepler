# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
# Builds Vega + Node image from .circleci/Dockerfile and runs build_sample_app inside it.
version: 2.1

# Pipeline parameters (override in CircleCI UI or when triggering the pipeline)
parameters:
  vega_sdk_version:
    type: string
    default: "0.21.5245"

# Define jobs to be invoked in workflows.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview
jobs:
  build-sample-app:
    description: Build Vega/Node Docker image and run build_sample_app inside it
    docker:
      - image: cimg/docker:24.0

    environment:
      VEGA_SDK_VERSION: << pipeline.parameters.vega_sdk_version >>

    steps:
      - checkout

      - setup_remote_docker:
          version: 24.0

      - run:
          name: Build Vega + Node image from Dockerfile
          command: |
            docker build \
              --build-arg VEGA_SDK_VERSION="${VEGA_SDK_VERSION}" \
              -f .circleci/Dockerfile \
              -t vega-builder \
              .

      - restore_cache:
          keys:
            - yarn-cache-{{ checksum "yarn.lock" }}
            - yarn-cache-

      - run:
          name: Install deps and run build_sample_app (inside Vega image)
          command: |
            docker run --rm \
              -v "$(pwd)":/workspace \
              -w /workspace \
              -e VEGA_SDK_VERSION="${VEGA_SDK_VERSION}" \
              vega-builder \
              bash -c "yarn install --frozen-lockfile && yarn run build_sample_app"

      - save_cache:
          key: yarn-cache-{{ checksum "yarn.lock" }}
          paths:
            - node_modules
            - apps/AEPSampleApp/node_modules

# Orchestrate jobs using workflows.
# See: https://circleci.com/docs/workflows/
workflows:
  build-sample-app-workflow:
    jobs:
      - build-sample-app
