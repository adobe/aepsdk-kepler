# Use the latest 2.1 version of CircleCI pipeline process engine.
# Vega/Kepler SDK and Node are installed via steps below (no Docker image build).
version: 2.1

orbs:
  node: circleci/node@7.1.0

# Pipeline parameters (override in CircleCI UI or when triggering the pipeline)
parameters:
  vega_sdk_version:
    type: string
    default: "0.21.5245"

jobs:
  build-sample-app:
    description: Install Vega/Kepler SDK and Node via steps, then run build_sample_app
    docker:
      - image: cimg/base:current

    environment:
      DEBIAN_FRONTEND: noninteractive
      NONINTERACTIVE: "true"
      VEGA_SDK_VERSION: << pipeline.parameters.vega_sdk_version >>

    steps:
      - checkout

      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y curl tar jq ca-certificates
            sudo rm -rf /var/lib/apt/lists/*

      - run:
          name: Install Vega/Kepler SDK
          command: |
            export NONINTERACTIVE=true
            export VEGA_SDK_VERSION="${VEGA_SDK_VERSION:-0.21.5245}"
            curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
            VEGA_BIN="${HOME}/vega/bin"
            [ -d "$VEGA_BIN" ] || VEGA_BIN="/root/vega/bin"
            echo "export PATH=\"${VEGA_BIN}:\${PATH}\"" >> $BASH_ENV
            source $BASH_ENV
            vega -v

      - node/install:
          node-version: "20.20.0"
          install-yarn: true

      - restore_cache:
          keys:
            - node-deps-{{ checksum "package-lock.json" }}
            - node-deps-

      - run:
          name: Install root dependencies
          command: yarn install

      - run:
          name: Build sample app
          command: yarn run build_sample_app

      - save_cache:
          key: node-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - apps/AEPSampleApp/node_modules

workflows:
  build-sample-app-workflow:
    jobs:
      - build-sample-app
