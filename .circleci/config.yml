# Use the latest 2.1 version of CircleCI pipeline process engine.
# Vega/Kepler SDK and Node are installed via steps below (no Docker image build).
# NPM_TOKEN/NODE_AUTH_TOKEN are cleared so only public registry is used (avoids EINTEGRITY from expired tokens).
version: 2.1

orbs:
  node: circleci/node@7.1.0

# Pipeline parameters (override in CircleCI UI or when triggering the pipeline)
parameters:
  vega_sdk_version:
    type: string
    default: "0.21.5245"

jobs:
  build-sample-app:
    description: Install Vega/Kepler SDK and Node via steps, then run build_sample_app
    docker:
      - image: cimg/base:current

    environment:
      DEBIAN_FRONTEND: noninteractive
      NONINTERACTIVE: "true"
      VEGA_SDK_VERSION: << pipeline.parameters.vega_sdk_version >>
      # Force public registry only - avoid expired/revoked tokens from CircleCI env
      NPM_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_AUTH_TOKEN: ""

    steps:
      - checkout

      - run:
          name: Disable npm auth (use public registry only)
          command: |
            echo 'unset NPM_TOKEN NODE_AUTH_TOKEN NPM_AUTH_TOKEN' >> $BASH_ENV
            echo "Auth tokens cleared for this job (public registry only)."

      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y curl tar jq ca-certificates
            sudo rm -rf /var/lib/apt/lists/*

      - run:
          name: Install Vega/Kepler SDK
          command: |
            export NONINTERACTIVE=true
            export VEGA_SDK_VERSION="${VEGA_SDK_VERSION:-0.21.5245}"
            curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
            VEGA_BIN="${HOME}/vega/bin"
            [ -d "$VEGA_BIN" ] || VEGA_BIN="/root/vega/bin"
            echo "export PATH=\"${VEGA_BIN}:\${PATH}\"" >> $BASH_ENV
            source $BASH_ENV
            vega -v

      - node/install:
          node-version: "20.20.0"
          install-yarn: true

      - restore_cache:
          keys:
            - node-deps-{{ checksum "package-lock.json" }}
            - node-deps-

      - run:
          name: Install root dependencies
          command: yarn install

      - run:
          name: Debug npm auth and registry (before build_sample_app)
          command: |
            echo "========== NPM AUTH DEBUG =========="
            echo "--- Auth-related env (values masked) ---"
            for v in NPM_TOKEN NODE_AUTH_TOKEN NPM_AUTH_TOKEN npm_config__auth; do
              if [ -n "${!v}" ]; then
                echo "${v}=SET (len=${#!v})"
              else
                echo "${v}=unset"
              fi
            done
            echo "--- Root .npmrc ---"
            cat .npmrc 2>/dev/null || echo "(no root .npmrc)"
            echo "--- apps/AEPSampleApp/.npmrc ---"
            cat apps/AEPSampleApp/.npmrc 2>/dev/null || echo "(no AEPSampleApp .npmrc)"
            echo "--- npm config (from root) ---"
            npm config list
            echo "--- npm config from apps/AEPSampleApp ---"
            (cd apps/AEPSampleApp && npm config list)
            echo "--- AEPSampleApp deps that hit registry (non-file:) ---"
            (cd apps/AEPSampleApp && node -e "
            const p = require('./package.json');
            const all = {...p.dependencies, ...p.devDependencies};
            const fromRegistry = Object.entries(all).filter(([k,v]) => !String(v).startsWith('file:'));
            console.log(fromRegistry.map(([k,v]) => k + '@' + v).join('\n'));
            ")
            echo "========== END NPM AUTH DEBUG =========="

      - run:
          name: Build sample app
          command: yarn run build_sample_app

      - save_cache:
          key: node-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - apps/AEPSampleApp/node_modules

workflows:
  build-sample-app-workflow:
    jobs:
      - build-sample-app
